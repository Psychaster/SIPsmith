<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="860" height="520" font-family="monospace,ui-monospace" font-size="12">
  <rect width="860" height="520" fill="#0d1117"/>
  <text x="430" y="28" fill="#e2e8f0" font-size="15" font-weight="bold" text-anchor="middle">SIPsmith — Lab Network Topology</text>

  <!-- ══ AIR-GAP boundary ══ -->
  <rect x="10" y="44" width="840" height="430" rx="10" fill="none" stroke="#333" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="430" y="62" fill="#334" font-size="10" text-anchor="middle">Air-Gapped Lab Network  (no internet path)</text>

  <!-- ══ SIPsmith Appliance ══ -->
  <rect x="320" y="178" width="220" height="144" rx="8" fill="#161b22" stroke="#4a9eff" stroke-width="2"/>
  <text x="430" y="200" fill="#4a9eff" font-size="12" font-weight="bold" text-anchor="middle">SIPsmith</text>
  <text x="430" y="216" fill="#64748b" font-size="9" text-anchor="middle">Ubuntu 24.04 · :8443</text>
  <text x="430" y="238" fill="#94a3b8" font-size="9" text-anchor="middle">DNS :53  CA  SFTP :22</text>
  <text x="430" y="252" fill="#94a3b8" font-size="9" text-anchor="middle">LDAP :389  LDAPS :636</text>
  <text x="430" y="266" fill="#94a3b8" font-size="9" text-anchor="middle">SIP emu :5080  CTI :2748</text>
  <text x="430" y="280" fill="#94a3b8" font-size="9" text-anchor="middle">NTP (chrony)</text>
  <text x="430" y="300" fill="#64748b" font-size="9" text-anchor="middle">PostgreSQL (internal)</text>
  <text x="430" y="315" fill="#64748b" font-size="9" text-anchor="middle">/var/lib/sipsmith/</text>

  <!-- ══ CUCM Publisher ══ -->
  <rect x="60" y="82" width="140" height="80" rx="6" fill="#141010" stroke="#f59e0b" stroke-width="1"/>
  <text x="130" y="103" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">CUCM Publisher</text>
  <text x="130" y="120" fill="#64748b" font-size="9" text-anchor="middle">AXL :8443</text>
  <text x="130" y="133" fill="#64748b" font-size="9" text-anchor="middle">CTI Mgr :2748</text>
  <text x="130" y="146" fill="#64748b" font-size="9" text-anchor="middle">SFTP :22 (DRS/CDR)</text>

  <!-- ══ CUCM Subscriber ══ -->
  <rect x="60" y="190" width="140" height="60" rx="6" fill="#141010" stroke="#78350f" stroke-width="1"/>
  <text x="130" y="212" fill="#d97706" font-size="10" font-weight="bold" text-anchor="middle">CUCM Subscriber</text>
  <text x="130" y="228" fill="#64748b" font-size="9" text-anchor="middle">LDAP Sync :389/:636</text>
  <text x="130" y="242" fill="#64748b" font-size="9" text-anchor="middle">DNS :53</text>

  <!-- ══ Expressway ══ -->
  <rect x="60" y="278" width="140" height="60" rx="6" fill="#0e1820" stroke="#0ea5e9" stroke-width="1"/>
  <text x="130" y="300" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">Expressway C/E</text>
  <text x="130" y="316" fill="#64748b" font-size="9" text-anchor="middle">SIP :5060/:5061</text>
  <text x="130" y="330" fill="#64748b" font-size="9" text-anchor="middle">CDR syslog → :514</text>

  <!-- ══ CMS ══ -->
  <rect x="60" y="366" width="140" height="60" rx="6" fill="#100e20" stroke="#8b5cf6" stroke-width="1"/>
  <text x="130" y="388" fill="#a78bfa" font-size="10" font-weight="bold" text-anchor="middle">Cisco Meeting Server</text>
  <text x="130" y="404" fill="#64748b" font-size="9" text-anchor="middle">CDR HTTP :443</text>
  <text x="130" y="418" fill="#64748b" font-size="9" text-anchor="middle">SIP :5060/:5061</text>

  <!-- ══ RoomOS Devices ══ -->
  <rect x="660" y="82" width="150" height="90" rx="6" fill="#0e1818" stroke="#06b6d4" stroke-width="1"/>
  <text x="735" y="103" fill="#22d3ee" font-size="10" font-weight="bold" text-anchor="middle">RoomOS Devices</text>
  <text x="735" y="120" fill="#64748b" font-size="9" text-anchor="middle">Board / Room / Desk</text>
  <text x="735" y="133" fill="#64748b" font-size="9" text-anchor="middle">xAPI HTTPS :443</text>
  <text x="735" y="146" fill="#64748b" font-size="9" text-anchor="middle">SIP :5060/:5061</text>
  <text x="735" y="160" fill="#64748b" font-size="9" text-anchor="middle">NTP ← SIPsmith</text>

  <!-- ══ SIP Endpoints ══ -->
  <rect x="660" y="196" width="150" height="70" rx="6" fill="#0a1418" stroke="#0ea5e9" stroke-width="1"/>
  <text x="735" y="218" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">SIP Phone / Soft</text>
  <text x="735" y="234" fill="#64748b" font-size="9" text-anchor="middle">Register :5080 (emu)</text>
  <text x="735" y="248" fill="#64748b" font-size="9" text-anchor="middle">DNS → SIPsmith :53</text>
  <text x="735" y="260" fill="#64748b" font-size="9" text-anchor="middle">certs from CA</text>

  <!-- ══ Lab Workstations ══ -->
  <rect x="660" y="290" width="150" height="70" rx="6" fill="#101418" stroke="#334" stroke-width="1"/>
  <text x="735" y="312" fill="#94a3b8" font-size="10" font-weight="bold" text-anchor="middle">Lab Workstations</text>
  <text x="735" y="328" fill="#64748b" font-size="9" text-anchor="middle">GUI :8443 (admin)</text>
  <text x="735" y="342" fill="#64748b" font-size="9" text-anchor="middle">SFTP :22 (uploads)</text>
  <text x="735" y="355" fill="#64748b" font-size="9" text-anchor="middle">DNS → :53</text>

  <!-- ══ AD Clients ══ -->
  <rect x="660" y="383" width="150" height="60" rx="6" fill="#120e18" stroke="#8b5cf6" stroke-width="1"/>
  <text x="735" y="405" fill="#a78bfa" font-size="10" font-weight="bold" text-anchor="middle">AD Clients</text>
  <text x="735" y="421" fill="#64748b" font-size="9" text-anchor="middle">Kerberos :88</text>
  <text x="735" y="435" fill="#64748b" font-size="9" text-anchor="middle">LDAP :389 SMB :445</text>

  <!-- ══ Arrows — left side ══ -->
  <!-- CUCM pub <-> SIPsmith -->
  <line x1="200" y1="115" x2="318" y2="222" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- CUCM sub <-> SIPsmith -->
  <line x1="200" y1="220" x2="318" y2="248" stroke="#d97706" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Expressway <-> SIPsmith -->
  <line x1="200" y1="300" x2="318" y2="268" stroke="#0ea5e9" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- CMS <-> SIPsmith -->
  <line x1="200" y1="388" x2="318" y2="300" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ══ Arrows — right side ══ -->
  <!-- RoomOS <-> SIPsmith -->
  <line x1="540" y1="222" x2="658" y2="128" stroke="#06b6d4" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- SIP phones <-> SIPsmith -->
  <line x1="540" y1="248" x2="658" y2="232" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- Workstations <-> SIPsmith -->
  <line x1="540" y1="268" x2="658" y2="322" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- AD clients <-> SIPsmith -->
  <line x1="540" y1="290" x2="658" y2="405" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Internet blocked -->
  <rect x="340" y="466" width="180" height="26" rx="4" fill="#200a0a" stroke="#4a1a1a" stroke-width="1"/>
  <text x="430" y="484" fill="#7f1d1d" font-size="10" font-weight="bold" text-anchor="middle">✗  No internet path  ✗</text>
</svg>
