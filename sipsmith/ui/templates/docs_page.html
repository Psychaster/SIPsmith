{% extends "base.html" %}
{% block title %}{{ page_title }} — Docs{% endblock %}
{% block content %}
<style>
/* ── Docs typography ──────────────────────────────────────────────── */
.docs-nav { display:flex; gap:0.5rem; flex-wrap:wrap; margin-bottom:1.5rem; }
.docs-nav a { color:#64748b; text-decoration:none; padding:0.25rem 0.6rem; border:1px solid #222;
              border-radius:4px; font-size:0.82em; }
.docs-nav a:hover, .docs-nav a.active { color:#4a9eff; border-color:#4a9eff; }
.docs-body h1 { color:#e2e8f0; font-size:1.6em; margin:1.5rem 0 0.5rem; border-bottom:1px solid #222; padding-bottom:0.4rem; }
.docs-body h2 { color:#cbd5e1; font-size:1.25em; margin:1.4rem 0 0.4rem; }
.docs-body h3 { color:#94a3b8; font-size:1.05em; margin:1.2rem 0 0.3rem; }
.docs-body p  { color:#94a3b8; line-height:1.65; margin:0.5rem 0; }
.docs-body ul, .docs-body ol { color:#94a3b8; padding-left:1.4rem; line-height:1.7; }
.docs-body li { margin-bottom:0.2rem; }
.docs-body code { background:#1e2734; color:#93c5fd; padding:0.1em 0.35em; border-radius:3px; font-size:0.88em; }
.docs-body pre  { background:#0d1117; border:1px solid #222; border-radius:6px; padding:1rem;
                  overflow-x:auto; margin:0.75rem 0; }
.docs-body pre code { background:none; color:#94a3b8; padding:0; font-size:0.85em; }
.docs-body blockquote { border-left:3px solid #4a9eff; margin:0.75rem 0; padding:0.4rem 1rem;
                         background:#0f1a2a; color:#7fa8d0; border-radius:0 4px 4px 0; }
.docs-body table { width:100%; border-collapse:collapse; margin:0.75rem 0; font-size:0.9em; }
.docs-body th { background:#161b22; color:#e2e8f0; padding:0.4rem 0.75rem; text-align:left;
                border:1px solid #222; }
.docs-body td { padding:0.35rem 0.75rem; border:1px solid #1a1a1a; color:#94a3b8; }
.docs-body tr:nth-child(even) td { background:#0f1117; }
.docs-body a  { color:#4a9eff; }
.docs-body hr { border:none; border-top:1px solid #222; margin:1.5rem 0; }
.docs-body img { max-width:100%; border-radius:6px; margin:0.75rem 0; }
</style>

<nav class="docs-nav">
  <a href="/docs/" {% if current_page == 'index' %}class="active"{% endif %}>Overview</a>
  <a href="/docs/install" {% if current_page == 'install' %}class="active"{% endif %}>Installation</a>
  <a href="/docs/admin" {% if current_page == 'admin' %}class="active"{% endif %}>Administrator Guide</a>
  <a href="/docs/user" {% if current_page == 'user' %}class="active"{% endif %}>User Guide</a>
  <a href="/docs/architecture" {% if current_page == 'architecture' %}class="active"{% endif %}>Architecture</a>
</nav>

<div class="docs-body">
  {{ content | safe }}
</div>
{% endblock %}
