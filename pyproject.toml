[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sipsmith"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "argon2-cffi>=23",
    "cryptography>=42",
    "pyotp>=2.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "itsdangerous>=2.2",
    "aiofiles>=23",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
]

[project.optional-dependencies]
appliance = [
    "pystemd>=0.13",   # requires libsystemd — Ubuntu 24.04 appliance only
]

dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
sipsmith = "sipsmith.main:main"
sipsmith-agent = "sipsmith.agent.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sipsmith*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "S", "B", "A"]
ignore = [
    "S101",   # assert in tests
    "S105",   # hardcoded passwords in example config
    "S106",
    "B008",   # FastAPI Depends() calls in function defaults
    "A003",   # shadowing builtins — id, type etc. in models
]
per-file-ignores = {"tests/*" = ["S", "B"], "alembic/*" = ["E402", "F401"]}

[tool.ruff.lint.isort]
known-first-party = ["sipsmith"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
